name: Release CLI Plugin Angular

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Trusted publishing (OIDC, no stored token) needs npm 11.5.1 or newer; Node 20 ships an older npm.
      - name: Update npm
        run: npm install -g npm@11.5.1

      - run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A push that does not bump the version (docs, CI) must neither fail on "cannot publish over the
      # previously published version" nor create a second tag or release. The registry answers a public
      # read without a token: 200 means the version exists, 404 means it does not.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2F}/$VERSION")
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, skipping publish and release"
          elif [ "$status" = "404" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm registry answered $status for $NAME@$VERSION, not publishing" >&2
            exit 1
          fi
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}

      # No npm token is stored anywhere: npm exchanges this workflow's identity (id-token: write above)
      # for a short-lived publish credential, which only works because the package's "Trusted Publisher"
      # setting on npmjs.com names this repository and this file (release.yml). The same identity signs
      # the provenance that npm shows on the package page.
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance

      - name: Tag and create a GitHub release
        if: steps.npm.outputs.published != 'true'
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$NAME $VERSION" \
              --notes "Published to npm: https://www.npmjs.com/package/$NAME/v/$VERSION" \
              --generate-notes
          fi
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          GH_TOKEN: ${{ github.token }}
